stages:
  - build
  - deploy

build_frontend:
  stage: build
  image: node:20
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - build
    expire_in: 1 week
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "TEST-FRONT"'

pages:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build_frontend
      artifacts: true
  script:
    - rm -rf public
    - mkdir public
    - cp -r build/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "TEST-FRONT"'

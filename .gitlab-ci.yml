stages:
  - build
  - deploy

build_frontend:
  stage: build
  image: node:20
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .npm/
  script:
    - rm -rf .npm || true
    - npm cache verify || true
    - node -v; npm -v
    - |
      NPM_CONFIG_AUDIT=false npm ci --prefer-offline --no-progress --cache .npm || \
      (echo "npm ci failed, falling back to npm install" && NPM_CONFIG_AUDIT=false npm install --prefer-offline --no-progress --cache .npm)
    - npm run build
  artifacts:
    paths:
      - build
    expire_in: 1 week
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "TEST-FRONT"'

pages:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build_frontend
      artifacts: true
  script:
    - rm -rf public
    - mkdir public
    - cp -r build/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "TEST-FRONT"'
